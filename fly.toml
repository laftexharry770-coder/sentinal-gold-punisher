app = "sentinal-mt5"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# iad (Ashburn, Virginia) sits beside MetaApi's vint-hill and new-york
# regions, which keeps every order's trip to MetaApi as short as it gets.
# Put your MetaApi accounts in one of those regions too.
#
# Secrets, set with `fly secrets set NAME=value`:
#   METAAPI_TOKEN         API access token from app.metaapi.cloud
#   METAAPI_MASTER_ID     MetaApi id of the master account
#   METAAPI_FOLLOWER_IDS  comma-separated MetaApi ids of the followers
#   ACCESS_KEY            required with LIVE_EXECUTION=true; open the site as https://<app>.fly.dev/?key=<ACCESS_KEY>
#   LIVE_EXECUTION        "true" to send real orders (paper fills otherwise)
#   AUTO_START_BOT        "true" to start the bot by itself after every deploy
[env]
  PORT = "4000"
  HOST = "0.0.0.0"
  SERVE_WEB = "true"
  TICK_INTERVAL_MS = "400"
  STATE_DIR = "/data"

# The uploaded strategy and settings survive deploys on this volume:
#   fly volumes create sentinal_data --size 1 --region iad
[mounts]
  source = "sentinal_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  # The engine holds its book in memory, so the machine must stay up to keep
  # trading. Stopping it on idle would flatten the session state.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
