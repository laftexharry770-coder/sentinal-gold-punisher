name: Publish terminal to gh-pages

# The standalone build runs the whole engine in the browser, so the site is a
# single static page. This publishes it to the gh-pages branch, which GitHub
# Pages serves with "Deploy from a branch".
on:
  push:
    # The development branch has been known by both names; publishing follows
    # whichever one receives the commit.
    branches:
      - main
      - claude/sentinal-gold-punisher
      - claude/sentinal-mt5-handoff-602958
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify the engine before publishing
        run: npm test

      - name: Build the standalone terminal
        run: |
          npm run build --workspace shared
          npm run build --workspace engine
          npm run build:standalone --workspace web

      - name: Push the built page to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # .nojekyll stops Pages running the site through Jekyll, which would
          # ignore files it does not recognise and slow every deploy down.
          touch web/dist-standalone/.nojekyll

          cd web/dist-standalone
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish terminal from ${GITHUB_SHA}"
          # The branch only ever holds the current build, so replace it wholesale.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
