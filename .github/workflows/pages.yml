name: Publish terminal to GitHub Pages

# The standalone build runs the whole engine in the browser, so Pages can host
# it as a plain static page — no server, no secrets.
on:
  push:
    branches: [main, claude/sentinal-mt5-handoff-602958]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify the engine before publishing
        run: npm test

      - name: Build the standalone terminal
        run: |
          npm run build --workspace shared
          npm run build --workspace engine
          npm run build:standalone --workspace web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
